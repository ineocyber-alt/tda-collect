name: collect

on:
  schedule:
    # GitHub cron 은 UTC 기준. 매시 17분에 실행 (정각은 몰려서 지연이 잦음)
    - cron: "17 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write         # 수집한 CSV 를 저장소에 커밋하기 위해 필요

concurrency:
  group: collect          # 이전 실행이 끝나기 전에 겹쳐 돌지 않게
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect (KST 날짜별 파일로 누적)
        run: python collect.py --feeds feeds.json --daily-dir data

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 데이터 없음"; exit 0
          fi
          git commit -m "collect $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
